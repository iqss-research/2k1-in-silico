name: Container

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: xtra/2k1-in-silico
  LOCAL_IMAGE: 2k1-in-silico:${{ github.sha }}

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build test image
        run: docker buildx build --load --platform linux/amd64 --file deploy/Dockerfile --tag "$LOCAL_IMAGE" .
      - name: Smoke-test final runtime image
        run: |
          docker run --detach --rm \
            --name 2k1-runtime-smoke \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --publish 127.0.0.1:3000:3000 \
            "$LOCAL_IMAGE"
          trap 'docker rm --force 2k1-runtime-smoke >/dev/null 2>&1 || true' EXIT
          test "$(docker exec 2k1-runtime-smoke id -u)" = "10001"
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            if ! docker container inspect --format '{{.State.Running}}' 2k1-runtime-smoke | grep --quiet true; then
              docker logs 2k1-runtime-smoke
              exit 1
            fi
            sleep 1
          done
          docker logs 2k1-runtime-smoke
          exit 1
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Create CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: cyclonedx
          output: sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: 2k1-container-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - name: Build and push immutable image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker buildx build --platform linux/amd64 --provenance=mode=max --sbom=true --file deploy/Dockerfile --tag "$image" --push .
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          echo "image=$REGISTRY/$ECR_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
        id: push
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image
        run: cosign sign --yes "${{ steps.push.outputs.image }}"
